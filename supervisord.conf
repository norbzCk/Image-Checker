[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mysqld]
command=/usr/sbin/mysqld
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:apache2]
command=/usr/sbin/apachectl -D FOREGROUND
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:inference]
command=/opt/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --app-dir /opt/inference
environment=INFERENCE_TOKEN="%(ENV_INFERENCE_TOKEN)s",MODEL_BACKEND="hf",MODEL_ID="umm-maybe/AI-image-detector",AI_LABELS="artificial,ai,fake,generated,ai-generated",HF_HOME="/models",MODEL_REVISION=""
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

services:
  imagecheck:
    build:
      context: .
    container_name: imagecheck-lamp
    ports:
      - "8081:80"
    environment:
      IMAGECHECK_DB_NAME: imagecheck
      IMAGECHECK_DB_USER: imagecheck_user
      IMAGECHECK_DB_PASSWORD: ${DB_PASSWORD:-norbZck@#$!12345}
      IMAGECHECK_DB_HOST: 127.0.0.1
      INFERENCE_TOKEN: ${INFERENCE_TOKEN:-change-me}
      INFERENCE_URL: http://127.0.0.1:8000
      APP_SECRET: ${APP_SECRET:-change-me-change-me-change}
      DB_NAME: imagecheck
      DB_USER: imagecheck_user
      DB_PASSWORD: ${DB_PASSWORD:-norbZck@#$!12345}
    volumes:
      - imagecheck_uploads:/var/www/uploads
      - imagecheck_mysql:/var/lib/mysql
    restart: unless-stopped

volumes:
  imagecheck_uploads:
  imagecheck_mysql:
